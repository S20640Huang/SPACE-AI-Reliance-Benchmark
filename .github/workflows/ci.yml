name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.15 and dependencies
        run: uv sync --python 3.15
      - name: Run offline unit tests
        run: uv run --python 3.15 python -m unittest discover -s tests -v
